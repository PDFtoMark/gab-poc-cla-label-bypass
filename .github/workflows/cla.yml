name: CLA Assistant
on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - closed
      - synchronize
      - labeled
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  checks: write
  issues: write
jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      # Replaces "Checkout Private Repo for Allowlist" + "Read Allowlist File":
      # the real allowlist lives in OpenZeppelin/cla-sigs and contains only trusted bots/users.
      - name: Read Allowlist File
        id: read_allowlist
        run: |
          ALLOWLIST="dependabot[bot],renovate[bot],alice"
          echo "allowlist=$ALLOWLIST" >> $GITHUB_OUTPUT
      - name: Check if user is in allowlist
        id: check_allowlist
        run: |
          PR_USER=${{ github.event.pull_request.user.login }}
          echo "event=${{ github.event_name }} resolved PR_USER=[$PR_USER]"
          echo "allowlist=[${{ steps.read_allowlist.outputs.allowlist }}]"
          if [[ "${{ steps.read_allowlist.outputs.allowlist }}" == *"$PR_USER"* ]]; then
            echo "is_allowed=true" >> $GITHUB_OUTPUT
          else
            echo "is_allowed=false" >> $GITHUB_OUTPUT
          fi
          echo "--- control: evaluate a real non-allowlisted login"
          if [[ "${{ steps.read_allowlist.outputs.allowlist }}" == *"some-outsider"* ]]; then
            echo "control_is_allowed=true"
          else
            echo "control_is_allowed=false"
          fi
      # Simulates contributor-assistant/github-action being unable to find a signature
      # for the PR author (i.e. the PR is NOT signed). continue-on-error matches target.
      - name: CLA Assistant
        id: cla_assistant
        continue-on-error: true
        run: |
          echo "simulated: no CLA signature on record for PR author"
          exit 1
      - name: Label PR as CLA Unsigned
        if: ${{ steps.cla_assistant.outcome != 'success' && steps.check_allowlist.outputs.is_allowed == 'false' }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          ENDPOINT="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels"
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"labels":["cla: unsigned"]}' \
            $ENDPOINT
          exit 1
      - name: Label PR as CLA Signed
        if: ${{ steps.cla_assistant.outcome == 'success' && steps.check_allowlist.outputs.is_allowed == 'false' }}
        run: echo "would mark signed"
      - name: Label PR as CLA Allowlist
        if: ${{ steps.check_allowlist.outputs.is_allowed == 'true' }}
        run: |-
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          ENDPOINT="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels"
          curl -sS -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ENDPOINT/cla:%20unsigned" || true
          curl -sS -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ENDPOINT/cla:%20signed" || true
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"labels":["cla: allowlist"]}' \
            $ENDPOINT

name: CLA Assistant
on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - closed
      - synchronize
      - labeled
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  checks: write
  issues: write
jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: Read Allowlist File
        id: read_allowlist
        run: |
          ALLOWLIST="alice,bob,OpenZeppelin"
          echo "allowlist=$ALLOWLIST" >> $GITHUB_OUTPUT
      - name: Check if user is in allowlist
        id: check_allowlist
        run: |
          PR_USER=${{ github.event.pull_request.user.login }}
          echo "event=${{ github.event_name }} resolved PR_USER=[$PR_USER]"
          echo "event payload top-level keys: $(jq -r 'keys|join(",")' "$GITHUB_EVENT_PATH")"
          if [[ "${{ steps.read_allowlist.outputs.allowlist }}" == *"$PR_USER"* ]]; then
            echo "is_allowed=true" >> $GITHUB_OUTPUT
          else
            echo "is_allowed=false" >> $GITHUB_OUTPUT
          fi
      - name: Show decision
        run: echo "is_allowed=${{ steps.check_allowlist.outputs.is_allowed }} commenter=${{ github.event.comment.user.login }}"
      - name: Label PR as CLA Unsigned
        if: ${{ steps.check_allowlist.outputs.is_allowed == 'false' }}
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          echo "would label $PR_NUMBER as cla: unsigned and exit 1"
          exit 1
      - name: Label PR as CLA Allowlist
        if: ${{ steps.check_allowlist.outputs.is_allowed == 'true' }}
        run: |-
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          ENDPOINT="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels"
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"labels":["cla: allowlist"]}' \
            $ENDPOINT
